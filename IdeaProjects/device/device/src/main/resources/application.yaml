spring:
  datasource:
    url: jdbc:mysql://localhost:3306/device_db
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  admin:
    email: ${ADMIN_EMAIL:admin@gmail.com}
    password: ${ADMIN_PASSWORD}
    name: Administrator

  scheduler:
    overdue-cron: "*/10 * * * * *"
    daily-overdue-report-cron: "0 0 8 * * *"
    zone: "Asia/Ho_Chi_Minh"
    reminder-hours: 24

jwt:
  signer-key: ${JWT_SIGNER_KEY}
  expiration-seconds: 3600