spring:
  datasource:
    url: jdbc:mysql://springboot-mysql-springboot-projects.g.aivencloud.com:18204/device_db?sslMode=REQUIRED
    username: ${DB_USERNAME:avnadmin}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  admin:
    email: ${ADMIN_EMAIL:admin@gmail.com}
    password: ${ADMIN_PASSWORD}
    name: Administrator

  password-reset:
    base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:5173/reset-password}
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:15}
    cooldown-seconds: ${PASSWORD_RESET_COOLDOWN_SECONDS:60}

  scheduler:
    overdue-cron: "*/10 * * * * *"
    daily-overdue-report-cron: "0 0 8 * * *"
    zone: "Asia/Ho_Chi_Minh"
    reminder-hours: 24

jwt:
  signer-key: ${JWT_SIGNER_KEY}
  expiration-seconds: 3600
