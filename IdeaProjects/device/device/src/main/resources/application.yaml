spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

app:
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  admin:
    email: ${ADMIN_EMAIL:admin@gmail.com}
    password: ${ADMIN_PASSWORD}
    name: Administrator

  password-reset:
    base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:5173/reset-password}
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:15}
    cooldown-seconds: ${PASSWORD_RESET_COOLDOWN_SECONDS:60}

  scheduler:
    overdue-cron: "*/10 * * * * *"
    daily-overdue-report-cron: "0 0 8 * * *"
    zone: "Asia/Ho_Chi_Minh"
    reminder-hours: 24

jwt:
  signer-key: ${JWT_SIGNER_KEY}
  expiration-seconds: 3600
