spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

server:
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: never
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: device
    distribution:
      percentiles-histogram:
        http.server.requests: true

app:
  mail:
    transport: ${MAIL_TRANSPORT:smtp}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  admin:
    email: ${ADMIN_EMAIL:admin@gmail.com}
    password: ${ADMIN_PASSWORD}
    name: Administrator

  password-reset:
    base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:5173/reset-password}
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:15}
    cooldown-seconds: ${PASSWORD_RESET_COOLDOWN_SECONDS:60}
    response-min-duration: ${PASSWORD_RESET_RESPONSE_MIN_DURATION:150ms}
    response-jitter: ${PASSWORD_RESET_RESPONSE_JITTER:25ms}

  device-file:
    export-batch-size: 500
    import-batch-size: 100
    excel-row-window: 100
    max-import-bytes: 10485760

  email-job:
    worker-enabled: ${EMAIL_JOB_WORKER_ENABLED:false}
    batch-size: 20
    worker-threads: 20
    lease-duration: 60s
    completed-retention: 30d
    failed-retention: 90d
    poll-delay-ms: 5000
    recovery-delay-ms: 30000
    cleanup-cron: "0 0 3 * * *"
    secret:
      active-key-version: ${EMAIL_JOB_SECRET_KEY_VERSION:v1}
      keys:
        v1: ${EMAIL_JOB_SECRET_KEY_BASE64}

  rate-limit:
    login:
      ip-limit: ${RATE_LIMIT_LOGIN_IP_LIMIT:20}
      identity-limit: ${RATE_LIMIT_LOGIN_IDENTITY_LIMIT:5}
      window: ${RATE_LIMIT_LOGIN_WINDOW:5m}
    password-reset:
      ip-limit: ${RATE_LIMIT_PASSWORD_RESET_IP_LIMIT:10}
      identity-limit: ${RATE_LIMIT_PASSWORD_RESET_IDENTITY_LIMIT:3}
      window: ${RATE_LIMIT_PASSWORD_RESET_WINDOW:15m}
    cleanup-batch-size: 1000
    cleanup-cron: "0 15 3 * * *"

  scheduler:
    overdue-cron: "*/10 * * * * *"
    daily-overdue-report-cron: "0 0 8 * * *"
    zone: "Asia/Ho_Chi_Minh"
    reminder-hours: 24

jwt:
  signer-key: ${JWT_SIGNER_KEY}
  expiration-seconds: 3600
