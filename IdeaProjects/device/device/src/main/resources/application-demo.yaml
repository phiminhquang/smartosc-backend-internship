spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      data-source-properties:
        sslMode: VERIFY_IDENTITY
        trustCertificateKeyStoreUrl: ${DB_TLS_TRUSTSTORE_URL}
        trustCertificateKeyStorePassword: ${DB_TLS_TRUSTSTORE_PASSWORD}
        trustCertificateKeyStoreType: JKS
        fallbackToSystemTrustStore: false
server:
  address: 0.0.0.0
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 16
      min-spare: 2
    accept-count: 32

app:
  cors:
    allowed-origins: ${FRONTEND_ORIGIN}
  mail:
    transport: resend
    from: ${RESEND_FROM:Device Management <onboarding@resend.dev>}
    resend:
      api-key: ${RESEND_API_KEY}
      from: ${RESEND_FROM:Device Management <onboarding@resend.dev>}
      allowed-recipients: ${RESEND_ALLOWED_RECIPIENTS}
  admin:
    email: ${ADMIN_EMAIL}
  password-reset:
    base-url: ${PASSWORD_RESET_BASE_URL}
  email-job:
    worker-enabled: true
    batch-size: 2
    worker-threads: 2
