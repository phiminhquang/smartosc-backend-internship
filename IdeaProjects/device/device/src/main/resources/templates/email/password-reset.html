<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt lại mật khẩu</title>
</head>
<body>
<p>Xin chào <span th:text="${name}">bạn</span>,</p>
<p>Chúng tôi nhận được yêu cầu đặt lại mật khẩu cho tài khoản Device Management của bạn.</p>
<p>
    <a th:href="${resetLink}">Đặt lại mật khẩu</a>
</p>
<p>Liên kết này chỉ dùng được một lần và sẽ hết hạn sau
    <span th:text="${expirationMinutes}">15</span> phút.
</p>
<p>Nếu bạn không gửi yêu cầu này, hãy bỏ qua email.</p>
</body>
</html>
